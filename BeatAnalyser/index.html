<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Beat Analyser</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!--
    CSInterface — Adobe CEP host SDK.
    Copy the real CSInterface.js from https://github.com/Adobe-CEP/CSInterface
    into the extension root before installing.
  -->
  <script src="CSInterface.js"></script>

  <!--
    WASM bundles.  Not committed to the repo — run `npm install` to copy them
    from node_modules into lib/.  See lib/aubio.js and lib/essentia.js for
    stub files and installation instructions.
  -->
  <script src="lib/aubio.js"></script>
  <script src="lib/essentia.js"></script>
</head>

<body>

  <!-- ═══════════════════════════════════════════════════════════════════
       Panel header
       ═══════════════════════════════════════════════════════════════════ -->
  <header class="panel-header">

    <div class="header-brand">
      <!--
        Inline SVG waveform icon — 7 bars of staggered heights simulate
        an audio spectral display.  fill="currentColor" inherits the accent
        colour from the parent .header-brand rule.
      -->
      <svg class="header-icon"
           viewBox="0 0 30 20"
           fill="currentColor"
           xmlns="http://www.w3.org/2000/svg"
           aria-hidden="true"
           focusable="false">
        <rect x="0"  y="9"  width="3" height="3"  rx="1.5" opacity="0.45"/>
        <rect x="4"  y="5"  width="3" height="11" rx="1.5" opacity="0.65"/>
        <rect x="8"  y="1"  width="3" height="18" rx="1.5" opacity="0.90"/>
        <rect x="12" y="6"  width="3" height="8"  rx="1.5" opacity="0.75"/>
        <rect x="16" y="0"  width="3" height="20" rx="1.5"/>
        <rect x="20" y="4"  width="3" height="12" rx="1.5" opacity="0.80"/>
        <rect x="27" y="8"  width="3" height="5"  rx="1.5" opacity="0.40"/>
      </svg>
      <span class="header-title">Beat Analyser</span>
    </div>

    <!-- Populated by cepBridge.getHostInfo() on init -->
    <span class="header-host" id="host-version" aria-label="Host application version"></span>

  </header>


  <!-- ═══════════════════════════════════════════════════════════════════
       Scrollable panel body
       ═══════════════════════════════════════════════════════════════════ -->
  <main class="panel-body">


    <!-- ── Primary action ─────────────────────────────────────────────── -->
    <section class="card" aria-label="Analysis controls">

      <button id="btn-analyse" class="btn btn-primary btn-block">
        <!-- Spinner: shown/hidden by main.js via display style -->
        <span class="btn-spinner" id="spinner" aria-hidden="true" style="display:none;"></span>
        <span id="btn-analyse-label">Analyse Active Clip</span>
      </button>

      <!--
        Drop zone — accepts audio files dragged from the OS or from Premiere's
        Project panel.  main.js handles the drop event, analyses the audio,
        imports the file into the project, places it on A2, and places beat
        markers automatically.
      -->
      <div class="drop-zone" id="drop-zone"
           role="region"
           aria-label="Drop audio file to analyse and auto-place on A2">
        <svg class="drop-zone-icon"
             viewBox="0 0 20 18"
             fill="none"
             stroke="currentColor"
             stroke-width="1.5"
             stroke-linecap="round"
             stroke-linejoin="round"
             xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true"
             focusable="false">
          <!-- Upload arrow -->
          <polyline points="10,1 10,12"/>
          <polyline points="6,5 10,1 14,5"/>
          <!-- Tray baseline -->
          <path d="M1 13v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3"/>
        </svg>
        <span class="drop-zone-label">Drop audio here</span>
        <span class="drop-zone-sub">
          Analyses BPM &amp; key, imports into project,
          places on A2 with beat markers
        </span>
      </div>

      <!--
        Shows the clip or file currently loaded.
        Updated by main.js on both the "Analyse Active Clip" and drop paths.
      -->
      <p class="clip-path" id="file-path" title="">No clip loaded</p>

    </section>


    <!-- ── Analysis results ───────────────────────────────────────────── -->
    <!--
      .has-results is toggled by main.js after a successful analysis run.
      Without it all metric values render in their dimmed placeholder state.
    -->
    <section class="card results-card" id="results-section" aria-label="Analysis results" aria-live="polite">

      <!-- BPM — hero metric -->
      <div class="bpm-display">
        <output class="bpm-number" id="bpm-value" aria-label="Beats per minute">—</output>
        <span class="bpm-label" aria-hidden="true">BPM</span>
      </div>

      <div class="results-divider" role="separator"></div>

      <!-- Key + Scale — rendered as "A Minor" or "C# Major" -->
      <div class="key-row">
        <span class="key-label">Key</span>
        <output class="key-name" id="key-display" aria-label="Musical key">—</output>
      </div>

      <!-- Key strength progress bar -->
      <div class="strength-row">
        <span class="strength-label">Strength</span>
        <div class="strength-track"
             role="progressbar"
             aria-valuenow="0"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-label="Key detection strength">
          <div class="strength-fill" id="key-strength-fill"></div>
        </div>
        <output class="strength-value" id="key-strength-value" aria-label="Key strength value">—</output>
      </div>

      <!-- Beat count -->
      <p class="beat-count" id="beat-count" aria-label="Beat count">— beats detected</p>


      <!--
        ── Compatibility outputs ──────────────────────────────────────────
        These elements are kept for main.js backwards-compatibility.
        They hold the raw values that the new display elements are built from,
        but are not directly visible in the UI.
        Update main.js to drive the new display elements directly when ready.
      -->
      <output id="key-value"        aria-hidden="true" hidden></output>
      <output id="scale-value"      aria-hidden="true" hidden></output>
      <output id="confidence-value" aria-hidden="true" hidden></output>

    </section>


    <!-- ── Timeline markers ───────────────────────────────────────────── -->
    <!--
      Beat markers are placed automatically after a drag-and-drop.
      This section exposes the manual controls for re-placing or clearing
      markers after an "Analyse Active Clip" run, or to override auto-placement.
    -->
    <section class="card" aria-label="Timeline marker controls">
      <h2 class="card-title">Beat Markers</h2>

      <div class="btn-group">
        <!--
          Enabled by main.js after a successful analysis.
          On drop, markers are placed automatically; this button allows
          manual re-placement (e.g. after changing the stride).
        -->
        <button id="btn-add-markers"
                class="btn btn-primary"
                disabled
                aria-disabled="true">
          Place Beat Markers
        </button>

        <button id="btn-clear-markers" class="btn btn-ghost">
          Clear
        </button>
      </div>

    </section>


    <!-- ── Status / log ───────────────────────────────────────────────── -->
    <section class="card card--log" aria-label="Status log">

      <!--
        #status: single-line status string updated by main.js (legacy).
        Rendered as the most-recent entry of the visual log.
        New code should append <li> items to #log directly.
      -->
      <p id="status" class="log-status">Initialising…</p>

      <ol class="log" id="log" aria-live="polite" aria-label="Activity log" reversed>
      </ol>

    </section>


    <!--
      ── Hidden compatibility elements ─────────────────────────────────
      Fragments required by the current main.js that have no equivalent
      in the redesigned UI.  Remove once main.js is updated.
    -->
    <div id="btn-get-clips"  hidden aria-hidden="true"></div>
    <div id="clips-table"    hidden aria-hidden="true"></div>
    <div id="btn-pick-file"  hidden aria-hidden="true"></div>

  </main>


  <!-- Application scripts — loaded after the DOM is ready -->
  <script src="js/cepBridge.js"></script>
  <script src="js/audioAnalyser.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
